# Today's lyrics videos, made automatically: the title large at the top center, captions in an opaque band along the
# bottom edge as in the old caption images, credits centered over a darkened frame.
name = "classic"

[title]
position = "top-center"
size = 84
margin = 56

[title.shadow]
blur = 6
opacity = 0.5

[caption]
style = "band"
band_color = "#000000"
text_color = "#FFFFFF"
band_height = 309

[credits]
size = 44
dim = 0.55

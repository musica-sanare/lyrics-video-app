<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lyrics-video sync</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <strong id="song-title"></strong>
  <button id="play" type="button" data-i18n="play.play">Play</button>
  <span id="time">0:00.00 / 0:00.00</span>
  <span class="modes">
    <button id="mode-tap" type="button" class="on" data-i18n="mode.tap">Tap</button><button id="mode-adjust" type="button" data-i18n="mode.adjust">Adjust</button>
  </span>
  <label><span data-i18n="offset.label">Reaction offset</span> <input id="offset" type="number" value="0" step="10"> ms</label>
  <button id="save" type="button" data-i18n="save.button">Save</button>
  <button id="preview-video" type="button" data-i18n="preview_video.button">Preview video</button>
  <button id="render" type="button" data-i18n="render.button">Render video</button>
  <span id="status" role="status"></span>
  <label class="language"><span data-i18n="lang.label">Language</span> <select id="language"></select></label>
</header>

<div id="error" class="error" role="alert" hidden><strong data-i18n="error.title">Error</strong> <span id="error-message"></span> <button id="error-close" type="button">×</button></div>
<div id="render-bar" class="render-bar" role="status" hidden>
  <span id="render-text"></span>
  <progress id="render-progress" max="1" value="0"></progress>
  <button id="render-cancel" type="button" data-i18n="render.cancel">Cancel</button>
  <button id="render-reveal" type="button" data-i18n="render.reveal">Show in Finder</button>
  <button id="render-close" type="button">×</button>
</div>
<div id="notices"></div>

<main>
  <div id="lines">
    <table>
      <thead><tr><th>#</th><th data-i18n="table.start">Start</th><th data-i18n="table.end">End</th><th data-i18n="table.caption">Caption</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="right">
    <div id="preview">
      <img id="still" alt="">
      <video id="pvideo" muted playsinline preload="auto" hidden></video>
      <div id="live" hidden><div class="cap" id="cap-a"></div><div class="cap" id="cap-b"></div></div>
      <span id="preview-note" class="note"></span>
    </div>
    <canvas id="overview"></canvas>
    <canvas id="zoom"></canvas>
    <div id="adjust" hidden>
      <span data-i18n="adjust.selected">Selected time:</span>
      <button type="button" data-shift="-0.5">−0.5</button><button type="button" data-shift="-0.05">−0.05</button>
      <button type="button" data-shift="0.05">+0.05</button><button type="button" data-shift="0.5">+0.5</button>
      <button id="replay" type="button" data-i18n="adjust.replay">Play from 2 s before</button>
      <button id="set-time" type="button" data-i18n="adjust.set">Set to the playhead</button>
      <button id="clear-time" type="button" data-i18n="adjust.clear">Clear this time</button>
      <button id="select-all" type="button" data-i18n="adjust.all">Select all lines</button>
      <span id="multi-info"></span>
    </div>
    <div id="help"></div>
  </div>
</main>
<audio id="audio" preload="auto"></audio>
<script src="/static/app.js"></script>
</body>
</html>

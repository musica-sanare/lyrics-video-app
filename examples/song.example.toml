# A song file for lyrics-video. Copy it next to your song in work/ (for example work/my-song/song.toml);
# real song files are ignored by Git. Paths are relative to this file; "~" means your home folder.

# One caption per line; ";" splits a caption into two rows. Empty lines are skipped but still count in file names.
lyrics = "lyrics.txt"
# When each caption is sung: "[mm:ss.xx]caption" per line; a time with no text ends the caption above it.
# Without it, stills show one chosen caption.
timing = "lyrics.lrc"

# The video (stills for now: `lyrics-video still`).
audio = "song.wav"                     # the song, for the spectrum
background_image = "background.jpg"    # covers the frame and is cropped, never stretched
title = "Song Title"
credits = ["by Your Name"]             # shown at the start and the end of the song
design = "soft"                        # a built-in design (soft, classic, panel), or a design file

[fonts]
default = "~/path/to/your-font.otf"    # every part of the video uses it unless it names its own

# Overrides of the design, part by part. Use a [design] table with `name` instead of `design = "..."` above:
# [design]
# name = "soft"
# [design.title]
# font = "~/path/to/title-font.otf"
# [design.caption]
# size = 56

[spectrum]
preset = "default"                     # an audio-spectrum-app preset name, or a preset file
set = []                               # overrides like its --set, for example ["look.baseline_y=0.45"]

[video]
width = 1920
height = 1080
fps = 30

# The caption images of the old lyrics image script (`lyrics-video captions`).
[captions]
output_dir = "captions"          # lyrics_<line index>.png are written here
# size = [1440, 232]             # width, height; by default the background image's size, or 1440 x 232
background = "#000000"           # "#RRGGBB", or an image whose center pixel is the color (an old sample PNG)
text_color = "#FFFFFF"           # same
font = "~/path/to/your-font.otf" # a font file outside the repository
font_index = 0                   # face in a .ttc collection
separator = ";"
file_prefix = "lyrics"

[compare]
text = "compare.txt"             # a line or two to try in every font
output_dir = "compare"
fonts = ["/System/Library/Fonts/ヒラギノ角ゴシック W3.ttc", "/System/Library/Fonts/ヒラギノ明朝 ProN.ttc"]
font_dirs = []                   # every .ttf, .otf, .ttc and .otc in these folders is added

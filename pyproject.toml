[project]
name = "lyrics-video-app"
version = "0.3.0"
description = "Make lyrics videos with an audio spectrum, fully offline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "audio-spectrum-app>=0.5.0",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "tomlkit>=0.13",
    "uvicorn>=0.54.0",
]

[project.scripts]
lyrics-video = "lyrics_video.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest",
]

[tool.uv.sources]
audio-spectrum-app = { path = "../audio-spectrum-app", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyrics_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
